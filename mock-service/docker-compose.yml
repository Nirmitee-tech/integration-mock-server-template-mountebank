services:
  mongodb:
    image: mongo:7.0
    container_name: mock-mongodb
    ports:
      - "27117:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: mock_service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build: ./backend
    container_name: mock-backend
    ports:
      - "3001:3001"
      - "10080-10099:10080-10099"
      - "10100-10119:10100-10119"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/mock_service
      PORT: 3001
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: mock-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
